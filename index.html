<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto en Texto de Amor ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f18;
            --card-bg: rgba(22, 26, 42, 0.8);
            --accent-pink: #ff4d7d;
            --text-light: #f3f4f6;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }
        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        header { text-align: center; padding: 2rem 1rem 1rem; z-index: 10; max-width: 800px; }
        header h1 {
            font-size: 2rem; font-weight: 700;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        header p { color: #9ca3af; font-size: 0.9rem; }
        main { z-index: 10; width: 100%; max-width: 1100px; padding: 1rem; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
        .controls-card {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); border-radius: 16px;
            padding: 1.25rem; width: 100%; max-width: 900px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem; align-items: center;
        }
        .control-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .control-group label { font-size: 0.8rem; font-weight: 600; color: #d1d5db; }
        .control-group input[type="text"] {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 0.5rem; border-radius: 8px; outline: none;
        }
        .control-group select, .control-group input[type="range"] {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 0.4rem; border-radius: 8px; outline: none; cursor: pointer;
        }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; grid-column: 1 / -1; justify-content: center; margin-top: 0.5rem; }
        .btn {
            background: linear-gradient(135deg, #ff4d7d, #e11d48); color: white; border: none;
            padding: 0.6rem 1.2rem; border-radius: 30px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
        }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }
        .canvas-container {
            position: relative; background: #000; border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border-color); max-width: 100%; display: flex; justify-content: center;
        }
        canvas#artCanvas { display: block; max-width: 100%; height: auto; cursor: crosshair; }
        #magnifier {
            position: absolute; width: 160px; height: 160px; border-radius: 50%;
            border: 3px solid var(--accent-pink); pointer-events: none; display: none;
            overflow: hidden; background-color: #000; z-index: 100;
        }
        #magnifierCanvas { position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <header>
        <h1>Retrato de Amor en Texto ❤️</h1>
        <p>Pasa el cursor o activa la lupa para ver cómo miles de palabras forman su fotografía.</p>
    </header>
    <main>
        <div class="controls-card">
            <div class="control-group" style="grid-column: span 2;">
                <label for="customText">Texto personalizado:</label>
                <input type="text" id="customText" value="TE AMO ❤️ JUNTOS SIEMPRE ❤️ NUESTRA HISTORIA ❤️">
            </div>
            <div class="control-group">
                <label for="fontSize">Tamaño del Texto: <span id="fontSizeVal">10px</span></label>
                <input type="range" id="fontSize" min="6" max="18" value="10" step="1">
            </div>
            <div class="control-group">
                <label for="renderMode">Estilo de Renderizado:</label>
                <select id="renderMode">
                    <option value="gold" selected>Dorado Cálido</option>
                    <option value="color">Texto con Color Original</option>
                    <option value="ascii">ASCII Clásico</option>
                </select>
            </div>
            <div class="control-group">
                <label for="contrast">Brillo / Contraste:</label>
                <input type="range" id="contrast" min="0.8" max="1.8" value="1.1" step="0.05">
            </div>
            <div class="btn-group">
                <button class="btn" id="toggleOriginalBtn">📷 Ver Foto Original</button>
                <button class="btn btn-secondary" id="toggleLoupeBtn">🔍 Lupa: ON</button>
                <button class="btn btn-secondary" id="downloadBtn">📥 Descargar Imagen</button>
            </div>
        </div>
        <div class="canvas-container">
            <canvas id="artCanvas"></canvas>
            <div id="magnifier"><canvas id="magnifierCanvas"></canvas></div>
        </div>
    </main>
    <script>
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');
        const mag = document.getElementById('magnifier');
        const magCanvas = document.getElementById('magnifierCanvas');
        const magCtx = magCanvas.getContext('2d');
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');

        const customTextInput = document.getElementById('customText');
        const fontSizeInput = document.getElementById('fontSize');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const renderModeSelect = document.getElementById('renderMode');
        const contrastInput = document.getElementById('contrast');
        const toggleOriginalBtn = document.getElementById('toggleOriginalBtn');
        const toggleLoupeBtn = document.getElementById('toggleLoupeBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let img = new Image();
        let showOriginal = false;
        let enableLoupe = true;

        img.crossOrigin = "Anonymous";

        let hearts = [];
        function initBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            hearts = Array.from({length: 25}, () => ({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                size: Math.random() * 12 + 8,
                speed: Math.random() * 0.8 + 0.3,
                opacity: Math.random() * 0.5 + 0.1,
                swing: Math.random() * 0.02
            }));
        }

        function drawBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            hearts.forEach(h => {
                h.y -= h.speed;
                h.x += Math.sin(h.y * h.swing) * 0.5;
                if (h.y < -20) {
                    h.y = bgCanvas.height + 20;
                    h.x = Math.random() * bgCanvas.width;
                }
                bgCtx.fillStyle = `rgba(255, 117, 140, ${h.opacity})`;
                bgCtx.font = `${h.size}px sans-serif`;
                bgCtx.fillText('❤️', h.x, h.y);
            });
            requestAnimationFrame(drawBg);
        }

        window.addEventListener('resize', initBg);
        initBg();
        drawBg();

        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            magCanvas.width = 160;
            magCanvas.height = 160;
            renderArt();
        };

        img.src = 'foto.jpg';

        function renderArt() {
            if (!img.complete || img.naturalWidth === 0) return;

            if (showOriginal) {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                return;
            }

            const fontSize = parseInt(fontSizeInput.value);
            fontSizeVal.innerText = fontSize + 'px';
            const mode = renderModeSelect.value;
            const contrast = parseFloat(contrastInput.value);
            
            const offCanvas = document.createElement('canvas');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            const offCtx = offCanvas.getContext('2d');
            offCtx.drawImage(img, 0, 0);
            
            const imgData = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;

            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = `bold ${fontSize}px 'Fira Code', monospace`;
            ctx.textBaseline = 'top';

            let rawText = customTextInput.value.trim() || "TE AMO ❤️";
            const words = Array.from(rawText);
            let charIndex = 0;

            const stepX = fontSize * 0.65;
            const stepY = fontSize * 0.85;

            for (let y = 0; y < canvas.height; y += stepY) {
                for (let x = 0; x < canvas.width; x += stepX) {
                    const pxX = Math.floor(x);
                    const pxY = Math.floor(y);
                    const idx = (pxY * canvas.width + pxX) * 4;

                    let r = imgData[idx];
                    let g = imgData[idx + 1];
                    let b = imgData[idx + 2];

                    if (r === undefined) continue;

                    r = Math.min(255, Math.max(0, (r - 128) * contrast + 128));
                    g = Math.min(255, Math.max(0, (g - 128) * contrast + 128));
                    b = Math.min(255, Math.max(0, (b - 128) * contrast + 128));

                    const brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                    const char = words[charIndex % words.length];
                    charIndex++;

                    if (mode === 'gold') {
                        ctx.fillStyle = `rgb(${Math.floor(r * 1.1)},${Math.floor(g * 0.85)},${Math.floor(b * 0.4)})`;
                    } else if (mode === 'color') {
                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                    } else if (mode === 'ascii') {
                        const v = Math.floor(brightness * 255);
                        ctx.fillStyle = `rgb(${v},${v},${v})`;
                    }

                    ctx.fillText(char, x, y);
                }
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            if (!enableLoupe) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            mag.style.display = 'block';
            
            const magX = e.clientX - rect.left - 80;
            const magY = e.clientY - rect.top - 80;
            mag.style.left = magX + 'px';
            mag.style.top = magY + 'px';

            magCtx.fillStyle = '#000';
            magCtx.fillRect(0, 0, 160, 160);
            
            const zoomFactor = 2.5;
            const srcSize = 160 / zoomFactor;
            
            magCtx.drawImage(
                canvas,
                mouseX - srcSize / 2,
                mouseY - srcSize / 2,
                srcSize,
                srcSize,
                0,
                0,
                160,
                160
            );
        });

        canvas.addEventListener('mouseleave', () => {
            mag.style.display = 'none';
        });

        customTextInput.addEventListener('input', renderArt);
        fontSizeInput.addEventListener('input', renderArt);
        renderModeSelect.addEventListener('change', renderArt);
        contrastInput.addEventListener('input', renderArt);

        toggleOriginalBtn.addEventListener('click', () => {
            showOriginal = !showOriginal;
            toggleOriginalBtn.innerText = showOriginal ? '✨ Ver Arte en Texto' : '📷 Ver Foto Original';
            renderArt();
        });

        toggleLoupeBtn.addEventListener('click', () => {
            enableLoupe = !enableLoupe;
            toggleLoupeBtn.innerText = enableLoupe ? '🔍 Lupa: ON' : '🔍 Lupa: OFF';
            if (!enableLoupe) mag.style.display = 'none';
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'foto.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
